<!DOCTYPE html>
<html>
<head>
    <title>Tetris JS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Neil Barkhina, Tetris, HtML5, Desktop, Keyboard Controls" />
    <meta name="description" content="Tetris Game written in Pure HTML, no Canvas. Minimalist Design and Wide browser support accross Desktop. Keyboard Controls." />
    <script src="jquery-3.3.1.min.js"></script>
    <script src="tetris.js"></script>
</head>
<body>
    <center><table id="divMain">
        <tr>
        <th id="gameArea">
            </div>
            <div id="gamediv">
            </div>
        </th>
        <th id="header">
            <h3><a href="https://github.com/nbarkhina/TetrisJS" target="_blank">Tetris JS</a></h3>
            <br><button id="btnStart" onclick="myApp.btnClick()">New Game</button>
            <br><button id="btnStart2" onclick="myApp.btnPause()"
            rv-text="data.getPauseButtonText | call data.game_mode">Pause</button>
            <a href="about:blank" title="bind some key to 'toggle-ecmascript-keys', and press it to interract with game"><h4>Cheat sheet:</h4></a>
            <table>
                <tr><th>Key</th>     <th>Action</th></tr>
                <tr><td>&larr;&uarr;&darr;&rarr;</td>  <td>Move figure</td></tr>
                <tr><td>a</td>       <td>Drop figure</td></tr>
                <tr><td>p</td>       <td>Pause</td></tr>
                <tr><td>n</td>       <td>New game</td></tr>
            </table>
        </th>
        </tr>
    </table></center>
</body>
</html>
